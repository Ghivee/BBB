<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<meta name="description" content="Atur ulang kata sandi akun BBB.id melalui tautan verifikasi email.">
<title>Lupa kata sandi - BBB.id</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23087653'/%3E%3Ctext x='16' y='22' font-family='Inter,Arial,sans-serif' font-size='15' font-weight='700' fill='white' text-anchor='middle'%3EB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../app.css">
<script src="../app.js" defer></script>
</head>
<body class="bbb-auth">
<main class="bbb-reset-main">
    <section class="bbb-reset-card">
        <a class="bbb-reset-back" href="../login/login.html"><span class="material-symbols-outlined" aria-hidden="true">arrow_back</span> Kembali ke halaman masuk</a>

        <div class="bbb-auth-heading">
            <span class="bbb-auth-eyebrow">Pemulihan akun</span>
            <h1>Atur ulang kata sandi</h1>
            <p>Masukkan email akunmu. Kami akan mengirim tautan aman untuk mengatur kata sandi baru.</p>
        </div>

        <form id="reset-form">
            <fieldset data-reset-step="1">
                <legend>Email akun</legend>
                <label for="reset-email">Email</label>
                <input autocomplete="email" id="reset-email" name="email" placeholder="nama@kampus.ac.id" required type="email">
            </fieldset>

            <fieldset data-reset-step="2" hidden disabled>
                <legend>Kata sandi baru</legend>
                <p class="bbb-field-help">Buat kata sandi baru untuk akunmu.</p>

                <label for="reset-password">Kata sandi baru</label>
                <input autocomplete="new-password" id="reset-password" minlength="8" name="password" required type="password">

                <label for="reset-confirm">Konfirmasi kata sandi baru</label>
                <input autocomplete="new-password" id="reset-confirm" minlength="8" name="confirmPassword" required type="password">
            </fieldset>

            <p class="bbb-form-message" id="reset-message" role="alert"></p>
            <button class="bbb-auth-submit" type="submit">Lanjutkan</button>
        </form>
    </section>
</main>
</body>
</html>
